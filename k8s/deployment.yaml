apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-webapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-webapp

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: devops-webapp

    spec:
      containers:
        - name: webapp

          image: amruth1docker/devops-cicd-k8s-demo:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 20
